name: al_tayer
description: "Al-Tayer: Fast on-demand delivery & errand service for Alexandria (Agamy / Bitash)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & Architecture
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7
  get_it: ^8.0.3
  go_router: ^14.2.0
  dartz: ^0.10.1

  # Network & Real-time
  dio: ^5.7.0
  socket_io_client: ^3.0.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI, Icons, Helpers
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.0.17
  intl: ^0.19.0
  url_launcher: ^6.3.0

  # Location & Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^9.1.7
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  image_path: "assets/icons/app_icon.png"
  android: true
  ios: true
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
