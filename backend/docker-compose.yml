version: '3.8'
services:
  db:
    image: postgis/postgis:15-3.4
    container_name: altayer_db
    environment:
      POSTGRES_USER: altayer_admin
      POSTGRES_PASSWORD: altayer_password_123
      POSTGRES_DB: altayer_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: altayer_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
